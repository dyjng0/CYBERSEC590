services:
  workshop:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workshop
    init: true
    ports:
      - "127.0.0.1:${LAB_PORT:-3333}:3333"
    volumes:
      - type: bind
        source: ./workshop
        target: /workshop
        bind:
          create_host_path: false
      - dependencies:/workshop/node_modules
      - build_output:/workshop/dist
    command:
      - sh
      - -c
      - exec ./node_modules/.bin/concurrently --kill-others "npm run dev:server" "node scripts/wait-for-backend.mjs && ./node_modules/.bin/vite --host 0.0.0.0 --port 3333 --strictPort"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

volumes:
  dependencies:
  build_output:
